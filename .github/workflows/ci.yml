# .github/workflows/ci.yml
#
# Jobs
# ────
#  lint      – RuboCop (Linting) — runs first; gates everything below
#
#  spec      – RSpec + SimpleCov HTML artifact (Unit Test)        ┐
#  bdd       – Cucumber + traceability.json artifact (Functional)   │ parallel,
#  security  – Brakeman + bundler-audit (Security Test)             │ after lint
#  perf      – greeting_bench.rb (Performance Test)                 │
#  spec-gate – openspec validate (OpenSpec)                         ┘
#
# Releasing lives in cd.yml, which runs via workflow_run only after this
# workflow finishes green for a v* tag push.

name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

# Cancel in-flight runs for the same ref so a fast-follow push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_JOBS: 4
  BUNDLE_RETRY: 3
  # Single source of truth for the Ruby toolchain across all jobs.
  # "3.3" tracks the latest 3.3.x: newer runner images (ubuntu-26.04, which
  # ubuntu-latest now resolves to) only build the latest patch of each series,
  # so an exact pin like 3.3.5 fails with a 404.
  RUBY_VERSION: "3.3"
  BUNDLER_VERSION: "2.5.23"

# ─────────────────────────────────────────────────────────────────────────────
# lint  (Linting — runs first; every other job is gated on it passing)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      # cd.yml writes the acceptance gate ref twice (uses: cannot take
      # expressions); fail here if the two ever drift or stop being vX.Y.Z.
      - name: Check acceptance gate ref
        run: bin/check-acceptance-ref
      - name: Run RuboCop
        run: |
          bundle check
          bundle exec rubocop \
            --config .rubocop.yml \
            --format github \
            --debug

# ─────────────────────────────────────────────────────────────────────────────
# spec  (Unit Tests — gated on lint)
# ─────────────────────────────────────────────────────────────────────────────
  spec:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Run RSpec
        run: bundle exec rspec --format progress --format html --out coverage/rspec.html

      - name: Upload SimpleCov HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simplecov-report
          path: coverage/
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# bdd  (Functional Tests — gated on lint)
# ─────────────────────────────────────────────────────────────────────────────
  bdd:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Create tmp directory
        run: mkdir -p tmp

      - name: Run Cucumber
        run: bundle exec cucumber --format progress

      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: traceability-report
          path: tmp/traceability.json
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# security  (Security Test — gated on lint)
# ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Brakeman static analysis
        run: bundle exec brakeman --no-pager -q -w2 --force

      - name: bundler-audit CVE check
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

# ─────────────────────────────────────────────────────────────────────────────
# perf  (Performance Test — gated on lint)
# ─────────────────────────────────────────────────────────────────────────────
  perf:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      # Restore a branch-scoped baseline so regression checks fire on
      # subsequent pushes to the same branch.  The cache is written back
      # automatically by actions/cache when the key is new.
      - name: Restore perf baseline cache
        uses: actions/cache@v5
        with:
          path: perf/baseline.json
          # Key includes the branch so each branch tracks its own baseline.
          # Changing the key suffix busts the cache intentionally.
          key: perf-baseline-${{ github.ref_name }}-v1
          restore-keys: |
            perf-baseline-${{ github.ref_name }}-

      - name: Run benchmark (fails on regression or budget breach)
        run: bundle exec ruby perf/greeting_bench.rb

# ─────────────────────────────────────────────────────────────────────────────
# spec-gate  (OpenSpec structural validation — gated on lint; blocks merge)
# ─────────────────────────────────────────────────────────────────────────────
  spec-gate:
    name: OpenSpec
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec

      - name: Validate all OpenSpec changes
        run: openspec validate --all --strict --json --no-interactive
