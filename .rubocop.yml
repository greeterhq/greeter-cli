plugins:
  - rubocop-rspec

# Merge our Exclude list with RuboCop's defaults (which exclude vendor/,
# node_modules/, etc.) instead of replacing them. Without this, adding any
# AllCops/Exclude entry drops the built-in excludes, so CI's bundler-cache
# install into vendor/bundle would get linted.
inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - 'bin/security-scan'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "features/**/*"

Metrics/ModuleLength:
  Exclude:
    - "spec/security/**/*"

# ---------------------------------------------------------------------------
# RSpec cops
#
# This project uses an intentional spec layout (spec/unit, spec/security)
# that diverges from rubocop-rspec's default class-mirroring convention, plus
# a cross-cutting security suite that describes behaviours rather than a single
# class. The settings below keep the cops meaningful for ordinary unit specs
# while not fighting that structure. (The domain latency benchmark now lives in
# the greeter-core gem.)
# ---------------------------------------------------------------------------

# Our unit specs live under spec/unit/... rather than spec/greeter/...,
# so the class-path-mirroring check does not apply.
RSpec/SpecFilePathFormat:
  Enabled: false

# Security specs and the exe subprocess spec describe behaviours, not one class.
# The live-docs tooling specs test spec-side tooling, not a Greeter class, and
# the trace fixtures are tag lists or child-run suites, not specs of a class.
RSpec/DescribeClass:
  Exclude:
    - "spec/security/**/*"
    - "spec/unit/exe/**/*"
    - "spec/trace_check_spec.rb"
    - "spec/unit/support/*_spec.rb"
    - "spec/fixtures/**/*"

# Security examples are inherently multi-step, and so are the live-docs
# tooling examples (one aggregate_failures example per scenario).
RSpec/ExampleLength:
  Exclude:
    - "spec/security/**/*"
    - "spec/trace_check_spec.rb"
    - "spec/unit/support/*_spec.rb"
    - "spec/workflows/ci_contract_spec.rb"

RSpec/MultipleExpectations:
  Exclude:
    - "spec/security/**/*"
    - "spec/unit/adapters/system_clock_spec.rb"

# The security suite generates examples in a loop from source-file paths;
# the "leaked" locals are the parameterisation mechanism, not test state.
RSpec/LeakyLocalVariable:
  Exclude:
    - "spec/security/**/*"

# Fixtures must not end in _spec.rb, so the suite never loads them.
RSpec/SpecFilePathSuffix:
  Exclude:
    - "spec/fixtures/**/*"

# The live-docs tooling specs need a temp dir, paths, a sha and fixture
# documents per example group.
RSpec/MultipleMemoizedHelpers:
  Exclude:
    - "spec/unit/support/*_spec.rb"
    - "spec/unit/bin/merge_repo_trace_spec.rb"
    - "spec/workflows/ci_contract_spec.rb"

# Fixture examples only need a trivial pass or fail; their status is the point.
RSpec/IdenticalEqualityAssertion:
  Exclude:
    - "spec/fixtures/**/*"

RSpec/ExpectActual:
  Exclude:
    - "spec/fixtures/**/*"

# Tagged wrapper contexts in the tag-only fixtures are named after the
# requirement, which does not start with when/with/without.
RSpec/ContextWording:
  Exclude:
    - "spec/fixtures/tag_only/**/*"
